<div class="post-card">

  <div class="post-header">
    <div class="post-avatar">{{ post.userName[0] | uppercase }}</div>
    <div>
      <b>{{ post.userName }}</b>
      <div class="post-date">{{ post.createdAt | date:'short' }}</div>
    </div>
    <app-report-button
      class="post-report"
      itemType="post"
      [itemId]="post.id"
      [itemPath]="'posts/' + post.id"
      [itemOwnerId]="post.userId">
    </app-report-button>
  </div>

  <p class="post-text">{{ post.content }}</p>

  <app-post-image
    *ngIf="post.imageUrl"
    [src]="post.imageUrl"
    [alt]="'Imagen publicada por ' + (post.userName || 'un usuario')"
    class="post-image">
  </app-post-image>

  <!-- acciones -->
  <div class="post-actions">

    <button (click)="toggleReaction('like')" class="btn-action">
      👍 {{ post.reactionsCount || 0 }}
    </button>

    <button class="btn-action">
      💬 {{ post.commentsCount || 0 }}
    </button>

    <button class="btn-action">
      🔁 {{ post.repostsCount || 0 }}
    </button>

    <button class="btn-action">
      ⭐ Guardar
    </button>
  </div>

</div>
