<div class="login-background">  <!-- Este contenedor usa login-bg en el SCSS -->
  <div class="login-page d-flex justify-content-center align-items-center">
    <div class="card login-card p-4">

      <div class="text-center mb-3">
        <img src="/assets/universidad-logo.png" class="university-logo">
      </div>

      <h2 class="mb-4 text-center">Campus Social</h2>

      <button class="btn btn-microsoft w-100 mb-3" (click)="microsoftPopup()">
        <img src="/assets/microsoft.png" class="ms-icon">
        Iniciar sesión con Microsoft
      </button>

      <div *ngIf="error" class="alert alert-danger mt-2">
        {{ error }}
      </div>

    </div>
  </div>
</div>
